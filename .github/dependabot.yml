version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    ignore:
      # jsdom 30 pulls in undici 8, which requires Node >=22.19.0;
      # this project is pinned to Node 20 (see package.json engines
      # and .github/workflows/coverage.yml / deploy.yml).
      - dependency-name: "jsdom"
        update-types: ["version-update:semver-major"]
      # eslint-plugin-jsx-a11y@6.10.2 (latest) only supports eslint
      # ^3-^9 as a peer dep; eslint 10 breaks `npm install` (no
      # --legacy-peer-deps) on Heroku's build.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
